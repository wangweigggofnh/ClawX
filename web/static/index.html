<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClawX - OpenClaw Remote</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --user-bg: #1f3a5f;
      --assistant-bg: #1c2128;
      --success: #3fb950;
      --error: #f85149;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--text); }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--error);
      transition: background 0.3s;
    }
    .status-dot.connected { background: var(--success); }
    .status-text { font-size: 12px; color: var(--text-muted); }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .session-badge {
      font-size: 11px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 12px;
      color: var(--text-muted);
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-icon {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px; height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
    }
    .btn-icon:hover { background: var(--bg-tertiary); color: var(--text); }

    /* Messages area */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: var(--text-muted);
      gap: 16px;
    }
    .welcome h2 { color: var(--text); font-size: 24px; font-weight: 600; }
    .welcome p { max-width: 400px; line-height: 1.6; }
    .welcome-icon { font-size: 48px; opacity: 0.6; }

    .message {
      margin-bottom: 16px;
      max-width: 85%;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }

    .message.user { margin-left: auto; }
    .message.assistant { margin-right: auto; }

    .message-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 4px;
    }
    .message.user .message-label { text-align: right; }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .message.user .message-bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
    }
    .message.assistant .message-bubble {
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* Code blocks in messages */
    .message-bubble code {
      background: rgba(110,118,129,0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .message-bubble pre {
      background: var(--bg);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid var(--border);
    }
    .message-bubble pre code {
      background: none;
      padding: 0;
      font-size: 12px;
    }

    .typing-indicator {
      display: inline-flex;
      gap: 4px;
      padding: 8px 14px;
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .typing-indicator span {
      width: 6px; height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* Input area */
    .input-area {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      max-width: 800px;
      margin: 0 auto;
    }
    .input-wrapper {
      flex: 1;
      position: relative;
    }
    textarea {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.5;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .input-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .header { padding: 10px 12px; }
      .messages { padding: 12px; }
      .message { max-width: 92%; }
      .input-area { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">Claw<span>X</span></div>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Connecting...</span>
      </div>
    </div>
    <div class="header-right">
      <span class="session-badge" id="sessionBadge">No session</span>
      <button class="btn-icon" onclick="newSession()" title="New Session">+</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">&#x1f680;</div>
      <h2>ClawX Remote</h2>
      <p>Send tasks to OpenClaw remotely from any device. Start a conversation to begin.</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <div class="input-wrapper">
        <textarea
          id="messageInput"
          placeholder="Send a message to OpenClaw..."
          rows="1"
          onkeydown="handleKeyDown(event)"
          oninput="autoResize(this)"
        ></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">&#x27A4;</button>
    </div>
    <div class="input-hint">Enter to send &middot; Shift+Enter for new line</div>
  </div>

  <script>
    // State
    let ws = null;
    let sessionId = null;
    let isStreaming = false;
    let currentAssistantEl = null;
    let reconnectTimer = null;
    let reconnectDelay = 1000;

    // Elements
    const messagesEl = document.getElementById('messages');
    const welcomeEl = document.getElementById('welcome');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const sessionBadge = document.getElementById('sessionBadge');

    // WebSocket connection
    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusDot.classList.add('connected');
        statusText.textContent = 'Connected';
        reconnectDelay = 1000;

        if (!sessionId) {
          newSession();
        }
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        handleServerMessage(msg);
      };

      ws.onclose = () => {
        statusDot.classList.remove('connected');
        statusText.textContent = 'Disconnected';
        scheduleReconnect();
      };

      ws.onerror = () => {
        statusDot.classList.remove('connected');
        statusText.textContent = 'Error';
      };
    }

    function scheduleReconnect() {
      if (reconnectTimer) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        statusText.textContent = 'Reconnecting...';
        connect();
        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
      }, reconnectDelay);
    }

    function wsSend(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
    }

    // Session management
    function newSession() {
      sessionId = 'session_' + Date.now();
      wsSend({ type: 'create_session', session_id: sessionId });
      sessionBadge.textContent = sessionId.slice(0, 20);

      // Clear messages
      messagesEl.innerHTML = '';
      messagesEl.appendChild(welcomeEl);
      welcomeEl.style.display = 'flex';
      currentAssistantEl = null;
    }

    // Message handling
    function handleServerMessage(msg) {
      switch (msg.type) {
        case 'session_created':
          sessionId = msg.session_id;
          sessionBadge.textContent = sessionId.slice(0, 20);
          break;

        case 'message':
          handleChatMessage(msg.message);
          break;

        case 'error':
          appendSystemMessage('Error: ' + msg.error);
          isStreaming = false;
          updateSendButton();
          break;
      }
    }

    function handleChatMessage(msg) {
      if (!msg) return;

      if (msg.role === 'user') {
        // User message echo - already displayed locally
        return;
      }

      // Assistant message (streaming)
      if (!currentAssistantEl || currentAssistantEl.dataset.msgId !== msg.id) {
        currentAssistantEl = appendMessage('assistant', msg.content, msg.id);
      } else {
        // Update existing message
        const bubble = currentAssistantEl.querySelector('.message-bubble');
        bubble.innerHTML = formatContent(msg.content);
      }

      if (msg.done) {
        isStreaming = false;
        currentAssistantEl = null;
        updateSendButton();
      }

      scrollToBottom();
    }

    function sendMessage() {
      const content = inputEl.value.trim();
      if (!content || isStreaming) return;

      welcomeEl.style.display = 'none';

      // Display user message locally
      appendMessage('user', content);

      // Send via WebSocket
      wsSend({
        type: 'message',
        session_id: sessionId,
        content: content,
      });

      inputEl.value = '';
      inputEl.style.height = 'auto';
      isStreaming = true;
      updateSendButton();
      showTypingIndicator();
      scrollToBottom();
    }

    function appendMessage(role, content, msgId) {
      hideTypingIndicator();

      const div = document.createElement('div');
      div.className = 'message ' + role;
      if (msgId) div.dataset.msgId = msgId;

      const label = document.createElement('div');
      label.className = 'message-label';
      label.textContent = role === 'user' ? 'You' : 'OpenClaw';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerHTML = formatContent(content);

      div.appendChild(label);
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function appendSystemMessage(text) {
      hideTypingIndicator();
      const div = document.createElement('div');
      div.style.cssText = 'text-align:center;color:var(--error);font-size:13px;padding:8px;';
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    function formatContent(text) {
      if (!text) return '';
      // Basic markdown-like formatting
      let html = escapeHtml(text);

      // Code blocks ```...```
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
      // Inline code `...`
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Bold **...**
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

      return html;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Typing indicator
    function showTypingIndicator() {
      hideTypingIndicator();
      const div = document.createElement('div');
      div.id = 'typingIndicator';
      div.className = 'typing-indicator';
      div.innerHTML = '<span></span><span></span><span></span>';
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    function hideTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    // UI helpers
    function updateSendButton() {
      sendBtn.disabled = isStreaming;
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // Init
    connect();
    inputEl.focus();
  </script>
</body>
</html>
